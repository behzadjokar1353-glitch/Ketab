
name: Build Smart Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # حذف setup-android@v3 برای جلوگیری از خطای sdkmanager tools
      - name: Locate Android SDK and install packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detect Android project directory
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] && \
             [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."

          elif [ -f "ketabkhaneh_houshmand/settings.gradle.kts" ] && \
               [ -f "ketabkhaneh_houshmand/app/build.gradle.kts" ]; then
            PROJECT_DIR="ketabkhaneh_houshmand"

          else
            echo "::error::Android project files not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle --version

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK file was not generated"
            find "$PROJECT_DIR" -path "*/build/outputs/*" -type f
            exit 1
          fi

          mkdir -p dist

          cp "$APK" \
            dist/Ketabkhaneh-Houshmand-debug.apk

          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ketabkhaneh-Houshmand-debug
          path: dist/Ketabkhaneh-Houshmand-debug.apk
          if-no-files-found: error
