
name: Build Smart Library APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -f "$CANDIDATE/app/build.gradle.kts" ] || \
               [ -f "$CANDIDATE/app/build.gradle" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find . -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found"

            find . -maxdepth 5 -type f | sort | head -n 250
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR="."

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Detected project: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          gradle --version

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK not generated"
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/*' -print || true
            exit 1
          fi

          mkdir -p dist

          cp "$APK" \
            dist/Ketabkhaneh-Houshmand-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ketabkhaneh-Houshmand-debug
          path: dist/Ketabkhaneh-Houshmand-debug.apk
          if-no-files-found: error
